name: Build Massicot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          pytest

      - name: Construire Android
        run: |
          echo "Commande Android à adapter"

      - name: Construire macOS
        run: |
          echo "Commande macOS à adapter"

      - name: Construire Windows
        run: |
          echo "Commande Windows à adapter"

      - name: Publier l’APK Android
        uses: actions/upload-artifact@v4
        with:
          name: Massicot-android
          path: "**/*.apk"
          if-no-files-found: error

      - name: Publier l’application macOS
        uses: actions/upload-artifact@v4
        with:
          name: Massicot-macos
          path: "dist/**"
          if-no-files-found: error

      - name: Publier l’exécutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: Massicot-windows
          path: "dist/massicot.exe"
          if-no-files-found: error
